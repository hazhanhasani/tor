[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tor-location-manager"
version = "1.9.4"
description = "Multi-panel Tor egress, Cloudflare CDN inbound, x-ui SSL web panel, and hybrid Iran/foreign tunnel manager with 3x-ui and PasarGuard routing"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0,<4",
  "gunicorn>=22,<24",
  "requests[socks]>=2.32,<3",
  "cryptography>=43,<46",
]

[tool.setuptools.packages.find]
include = ["torpanel*"]

[tool.setuptools.package-data]
torpanel = ["templates/*.html", "templates/components/*.html", "static/*.css", "static/*.js"]
