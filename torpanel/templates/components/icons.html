{% macro icon(name, cls='icon') -%}
<svg class="{{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'dashboard' %}<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="4" rx="2"/><rect x="14" y="11" width="7" height="10" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/>
{% elif name == 'globe' %}<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>
{% elif name == 'link' %}<path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.2 1.2"/><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.2-1.2"/>
{% elif name == 'update' %}<path d="M20 6v5h-5"/><path d="M4 18v-5h5"/><path d="M18.5 9A7 7 0 0 0 6.2 6.2L4 8M5.5 15A7 7 0 0 0 17.8 17.8L20 16"/>
{% elif name == 'terminal' %}<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/>
{% elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{% elif name == 'sync' %}<path d="M20 7v5h-5M4 17v-5h5"/><path d="M18.2 10A7 7 0 0 0 6 6.5L4 9M5.8 14A7 7 0 0 0 18 17.5l2-2.5"/>
{% elif name == 'logout' %}<path d="M10 17l5-5-5-5M15 12H3"/><path d="M14 4h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5"/>
{% elif name == 'sun' %}<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
{% elif name == 'menu' %}<path d="M4 6h16M4 12h16M4 18h16"/>
{% elif name == 'shield' %}<path d="M12 3 4.5 6v5.5c0 4.4 3 7.7 7.5 9.5 4.5-1.8 7.5-5.1 7.5-9.5V6L12 3Z"/><path d="m9 12 2 2 4-4"/>
{% elif name == 'server' %}<rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01M11 7h6M11 17h6"/>
{% elif name == 'route' %}<circle cx="6" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="M8 6h5a3 3 0 0 1 3 3v6M13 15l3 3 3-3"/>
{% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
{% elif name == 'x' %}<path d="m6 6 12 12M18 6 6 18"/>
{% elif name == 'search' %}<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>
{% elif name == 'copy' %}<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/>
{% elif name == 'edit' %}<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4L16.5 3.5Z"/>
{% elif name == 'trash' %}<path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/>
{% elif name == 'pulse' %}<path d="M3 12h4l2-6 4 12 2-6h6"/>
{% elif name == 'chevron' %}<path d="m9 18 6-6-6-6"/>
{% elif name == 'lock' %}<rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
{% elif name == 'wifi' %}<path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 20h.01"/>
{% else %}<circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>{% endif %}
</svg>
{%- endmacro %}
