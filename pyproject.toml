[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tor-location-manager"
version = "1.13.0"
description = "Multi-panel Tor egress with native 3x-ui Cloudflare WARP, CDN inbound, Origin CA TLS, and hybrid Iran/foreign tunneling"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0,<4",
  "gunicorn>=22,<24",
  "requests[socks]>=2.32,<3",
  "cryptography>=43,<46",
]

[tool.setuptools.packages.find]
include = ["torpanel*"]

[tool.setuptools.package-data]
torpanel = ["templates/*.html", "templates/components/*.html", "static/*.css", "static/*.js"]
