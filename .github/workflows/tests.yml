name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e . -r requirements-dev.txt
      - name: Compile
        run: |
          python -m compileall -q torpanel
          python -m py_compile scripts/tlm-node-agent.py scripts/tlm-port-fabric.py
      - name: Shell syntax
        run: bash -n install.sh bootstrap.sh scripts/tor-location-manager-update scripts/install-xray scripts/install-warp scripts/tlm-node-bootstrap.sh
      - name: Test
        env:
          TORPANEL_FERNET_KEY: RkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkY=
        run: python -m pytest -q
